[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-service"
version = "2.0.0"
description = "Inventory and stock tracking microservice"
requires-python = ">=3.9"
# NOTE: If you update a dependency version below, please also update the auto SCIP index policy in sourcegraph.com
dependencies = ["core-logger", "fastapi==0.128.0", "uvicorn[standard]>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]
